<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 50% 15%, #182854 0%, #090e1c 55%, #03060d 100%);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    text-align: center;
    margin-top: 90px;
    margin-bottom: 45px;
    padding: 0 60px;
  }
  .tag {
    display: inline-block;
    padding: 10px 28px;
    background: rgba(6, 182, 212, 0.2);
    border: 1px solid rgba(6, 182, 212, 0.45);
    border-radius: 999px;
    color: #38bdf8;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .title {
    font-size: 66px;
    font-weight: 900;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 30%, #38bdf8 80%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 26px;
    color: #94a3b8;
    max-width: 840px;
    line-height: 1.4;
  }
  .phone-frame {
    width: 800px;
    height: 1450px;
    background: #0b1120;
    border: 9px solid #1e293b;
    border-radius: 68px 68px 0 0;
    box-shadow: 0 -25px 90px rgba(6, 182, 212, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 32px;
  }
  .notch {
    width: 240px;
    height: 34px;
    background: #000;
    border-radius: 0 0 22px 22px;
    margin: 0 auto 20px auto;
  }
  .now-playing-box {
    width: 100%;
    height: 480px;
    background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
    border-radius: 32px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    position: relative;
  }
  .disk-glow {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    box-shadow: 0 0 60px rgba(56, 189, 248, 0.6);
  }
  .pip-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(14, 165, 233, 0.2);
    border: 1px solid rgba(56, 189, 248, 0.5);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 700;
    color: #38bdf8;
  }
  .bg-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(168, 85, 247, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.5);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 700;
    color: #c084fc;
  }
  .track-info {
    text-align: center;
    margin-top: 36px;
  }
  .track-title {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .track-artist {
    font-size: 24px;
    color: #38bdf8;
  }
  .progress-container {
    margin-top: 40px;
    width: 100%;
  }
  .bar-bg {
    width: 100%;
    height: 12px;
    background: #1e293b;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    width: 62%;
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    border-radius: 6px;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    color: #94a3b8;
    font-size: 20px;
  }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-top: 40px;
  }
  .ctrl-btn {
    font-size: 40px;
    color: #cbd5e1;
    cursor: pointer;
  }
  .play-pause-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="tag">Audio Continuo & PiP</div>
    <div class="title">Reproducción en Segundo Plano</div>
    <div class="subtitle">Sigue escuchando música con la pantalla apagada o mira videos en ventana flotante (Picture-in-Picture).</div>
  </div>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="now-playing-box">
      <div class="pip-badge">📺 Modo PiP Activo</div>
      <div class="bg-badge">🎧 Background Audio</div>
      <div class="disk-glow">🎶</div>
    </div>
    <div class="track-info">
      <div class="track-title">Revival Bass Extended Mix</div>
      <div class="track-artist">DJ Holy Sound · Set en Vivo</div>
    </div>
    <div class="progress-container">
      <div class="bar-bg">
        <div class="bar-fill"></div>
      </div>
      <div class="time-row">
        <span>24:18</span>
        <span>42:30</span>
      </div>
    </div>
    <div class="controls-row">
      <div class="ctrl-btn">⏮️</div>
      <div class="ctrl-btn">⏪</div>
      <div class="play-pause-circle">⏸️</div>
      <div class="ctrl-btn">⏩</div>
      <div class="ctrl-btn">⏭️</div>
    </div>
  </div>
</body>
</html>
